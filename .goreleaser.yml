version: 2

before:
  hooks:
    - go mod download
    - go generate ./...
builds:
  -
    env:
      - CGO_ENABLED=0

    binary: cert-manager-webhook-vultr

    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.VersionPrerelease= '

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  -
    formats: [tar.gz]

    files:
      - none*

    format_overrides:
      - goos: windows
        formats: [zip]


checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .ProjectName }}_v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^testdata:'
      - '^deploy:'

dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    images:
      - vultr/cert-manager-webhook-vultr
    tags:
      - release
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64


release:
  draft: true
  github:
    owner: vultr
    name: cert-manager-webhook-vultr
